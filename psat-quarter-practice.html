<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSAT Quarter Practice</title>
<style>
:root{
  --blue:#324dc7; --blue-d:#2539a3; --ink:#1e1e1e; --muted:#5b616b; --line:#c9ced8;
  --soft:#f3f4f7; --head:#e9eef7; --red:#c3253d; --green:#1d7a46; --hl:#fde68a;
  --serif:"Noto Serif", Georgia, "Times New Roman", serif;
  --sans:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
#app{height:100dvh;display:flex;flex-direction:column}
.dash{height:3px;flex:none;background:repeating-linear-gradient(90deg,#3d6ad6 0 14px,transparent 14px 18px,#e0a32e 18px 32px,transparent 32px 36px,#d24c5d 36px 50px,transparent 50px 54px,#2f9e74 54px 68px,transparent 68px 72px)}
/* ---------- top bar ---------- */
.tb{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:10px 24px;background:var(--head);min-height:64px}
.sec-title{font-weight:700;font-size:16px}
.link{color:var(--ink);font-weight:600;font-size:14px;padding:4px 0;display:inline-flex;gap:4px;align-items:center}
.link:hover{text-decoration:underline}
.tb-c{text-align:center}
.timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-height:26px}
.timer.warn{color:var(--red)}
.pill-sm{border:1px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:600;margin-top:2px;background:#fff}
.tb-r{display:flex;justify-content:flex-end;gap:18px}
.tool{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;gap:2px;padding:2px 4px;border-radius:6px}
.tool:hover{background:rgba(0,0,0,.06)}
.tool svg{width:22px;height:22px}
.tool.on{color:var(--blue)}
/* ---------- main ---------- */
main{flex:1;min-height:0;overflow:hidden;display:flex;transition:margin-left .2s}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.pane{overflow:auto;padding:32px 40px}
.pane.left{border-right:3px solid #d6d9df}
.single{flex:1;overflow:auto;padding:32px 24px}
.single .inner{max-width:720px;margin:0 auto}
.passage{font-family:var(--serif);font-size:17px;line-height:1.65}
.passage p{margin:0 0 14px}
.passage mark{background:var(--hl);cursor:pointer;border-bottom:2px solid #e3b23c}
.tlabel{font-family:var(--sans);font-weight:700;font-size:14px;margin:14px 0 6px!important}
.passage table{border-collapse:collapse;font-family:var(--sans);font-size:14px;margin:8px 0 16px;width:100%}
.passage th,.passage td{border:1px solid #999;padding:6px 8px;text-align:center}
.passage caption{font-weight:700;padding-bottom:6px;font-size:14px}
.passage ul{margin:0 0 14px;padding-left:22px}
.qbar{display:flex;align-items:center;gap:14px;background:#f0f0f0;padding:0 10px 0 0;height:40px}
.qnum{background:var(--ink);color:#fff;font-weight:700;height:40px;min-width:36px;display:flex;align-items:center;justify-content:center;padding:0 10px}
.mark{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.mark.on{color:var(--red);font-weight:700}
.abc{margin-left:auto;font-size:12px;font-weight:800;border:1.5px solid var(--ink);border-radius:5px;padding:2px 6px;text-decoration:line-through}
.abc.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dashline{height:2px;background:repeating-linear-gradient(90deg,#1e1e1e 0 6px,transparent 6px 10px);margin-bottom:18px}
.prompt{font-family:var(--serif);font-size:17px;line-height:1.6;margin-bottom:18px}
.choices{display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:10px}
.choice{flex:1;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--ink);border-radius:9px;padding:10px 14px;font-family:var(--serif);font-size:16px;line-height:1.45;position:relative;background:#fff}
.choice:hover{border-color:var(--blue)}
.choice.sel{border:3px solid var(--blue);padding:8.5px 12.5px}
.let{flex:none;width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:14px}
.choice.sel .let{background:var(--blue);border-color:var(--blue);color:#fff}
.choice.struck{opacity:.45}
.choice.struck::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;border-top:2px solid var(--ink)}
.strike{flex:none;font-size:12px;font-weight:700;min-width:44px;display:flex;justify-content:center}
.strike .sl{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.strike .sl::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;border-top:1.5px solid var(--ink)}
.strike.undo{text-decoration:underline}
.spr-l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.spr{width:200px;font-size:20px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;font-family:var(--sans)}
.spr:focus{outline:3px solid var(--blue);outline-offset:1px}
.preview{margin-top:14px;font-size:15px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.1;margin:0 2px}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 2px}
.fig{display:flex;justify-content:center;margin:0 0 14px}
.sprdir{font-size:14px;line-height:1.6;font-family:var(--sans)}
.sprdir h3{margin:0 0 10px;font-size:16px}
.sprdir table{border-collapse:collapse;margin-top:10px;width:100%}
.sprdir th,.sprdir td{border:1px solid #aaa;padding:5px 8px;text-align:left;font-size:13px}
/* ---------- footer ---------- */
.fb{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 24px;min-height:64px;position:relative;background:#fff}
.fb-l{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn{background:var(--ink);color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.fb-r{display:flex;justify-content:flex-end;gap:10px}
.btn{background:var(--blue);color:#fff;border-radius:999px;padding:10px 26px;font-weight:700;font-size:15px}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.35;cursor:default}
.btn.outline{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:8px 24px}
/* ---------- navigator ---------- */
.pop{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:min(520px,94vw);background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.28);padding:18px 20px;z-index:20}
.pop h4{margin:0 0 10px;text-align:center;font-size:15px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.gq{width:38px;height:38px;border:1.5px dashed var(--ink);border-radius:4px;font-weight:700;color:var(--blue);position:relative;display:flex;align-items:center;justify-content:center;background:#fff}
.gq.done{border:1.5px solid var(--blue);background:var(--blue);color:#fff}
.gq .flag{position:absolute;top:-7px;right:-6px}
.gq .pin{position:absolute;top:-17px;left:50%;transform:translateX(-50%)}
.pop .btn{display:block;margin:16px auto 0}
/* ---------- review page ---------- */
.review{flex:1;overflow:auto;padding:36px 20px}
.review .inner{max-width:760px;margin:0 auto;text-align:center}
.review h1{font-size:30px;margin:0 0 14px}
.review p{color:var(--muted);margin:4px 0}
.rcard{margin-top:26px;border-radius:12px;box-shadow:0 2px 18px rgba(0,0,0,.14);padding:20px;text-align:left}
.rcard .rhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px}
.rcard .grid{justify-content:flex-start}
/* ---------- full-page screens ---------- */
.page{flex:1;overflow:auto;padding:40px 20px}
.page .inner{max-width:760px;margin:0 auto}
.page h1{font-size:32px;margin:0 0 8px}
.lead{color:var(--muted);font-size:16px;line-height:1.55}
.box{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:20px 0}
.box table{width:100%;border-collapse:collapse;font-size:15px}
.box th,.box td{padding:8px 6px;border-bottom:1px solid #e3e6ec;text-align:left}
.box th{font-size:13px;color:var(--muted);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.field input{font-size:16px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;max-width:340px}
.brk{background:#1e1e1e;color:#fff}
.brk .inner{text-align:center}
.brk .clock{display:inline-block;border:1.5px solid #fff;border-radius:14px;padding:20px 40px;margin:26px 0}
.brk .clock div:first-child{font-size:14px;opacity:.8}
.brk .clock div:last-child{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.brk .btn{background:#ffd23f;color:#1e1e1e}
/* ---------- results ---------- */
.scorebig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.scorebig b{font-size:64px;line-height:1;color:var(--blue)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.sc{border:1px solid var(--line);border-radius:12px;padding:16px}
.sc .l{font-size:13px;color:var(--muted);font-weight:600}
.sc .v{font-size:34px;font-weight:800;margin:4px 0}
.sc .s{font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.55;background:var(--soft);border-radius:10px;padding:12px 14px}
.dom td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#e3e6ec;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
details.rq{border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
details.rq summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.rq summary::-webkit-details-marker{display:none}
.badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.ok .badge{background:var(--green)} .bad .badge{background:var(--red)}
.rs{font-weight:600}
.ra{font-size:13px;color:var(--muted);margin-left:auto}
.rbody{padding:4px 16px 16px;border-top:1px solid #e3e6ec}
.rbody .passage,.rbody .prompt{font-size:15px}
.rch{font-family:var(--serif);font-size:15px;padding:6px 10px;border-radius:6px;margin:4px 0}
.rch.c{background:#e3f3e9;font-weight:600}
.rch.w{background:#fbe5e8;text-decoration:line-through}
.expl{background:var(--soft);border-left:4px solid var(--blue);padding:10px 12px;border-radius:6px;font-size:14px;line-height:1.6;margin-top:10px}
/* ---------- modal / calc / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px}
.mbox h2{margin:0 0 12px;font-size:20px}
.mbox p,.mbox li{font-size:15px;line-height:1.6}
.mbox .btn{margin-top:14px}
.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.refgrid div{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;line-height:1.5}
.refgrid b{display:block;font-size:13px;color:var(--muted)}
#calc{position:fixed;left:0;top:67px;bottom:67px;width:min(460px,100vw);background:#fff;box-shadow:4px 0 22px rgba(0,0,0,.2);z-index:30;display:flex;flex-direction:column}
#calc[hidden]{display:none}
#calc.wide{width:min(760px,100vw)}
.chead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.chead button{color:#fff;font-size:13px;padding:2px 8px}
#calcBody{flex:1;min-height:0}
body.calc-open main{margin-left:460px}
body.calc-open.calc-wide main{margin-left:760px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
@media (max-width:820px){
  .tb{padding:8px 12px;gap:8px}
  .sec-title{font-size:13px}
  .split{grid-template-columns:1fr;overflow:auto}
  .pane{overflow:visible;padding:20px 16px}
  .pane.left{border-right:0;border-bottom:3px solid #d6d9df}
  .single{padding:20px 16px}
  .fb{padding:8px 12px;gap:8px}
  .btn{padding:9px 16px;font-size:14px}
  .navbtn{padding:7px 10px;font-size:13px}
  .fb-l{display:none}
  .fb{grid-template-columns:auto 1fr}
  .fb-c{justify-self:start}
  body.calc-open main,body.calc-open.calc-wide main{margin-left:0}
  #calc,#calc.wide{width:100vw}
  .scores{grid-template-columns:1fr}
  .refgrid{grid-template-columns:1fr}
  .tb-r{gap:6px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="calc" hidden>
  <div class="chead"><span>Calculator</span><span><button data-act="calcwide" id="calcWideBtn">Expand</button><button data-act="calc">Close ✕</button></span></div>
  <div id="calcBody"><p style="padding:16px;font-size:14px">Loading Desmos…</p></div>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
/* ============================================================
   QUESTION BANK — all items are original, modeled on the
   official digital PSAT/NMSQT question types and domains.
   People named in passages are fictional.
   ============================================================ */
const L = ['A','B','C','D'];
const fr = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;

const MODS = [
{ sec:'rw', name:'Section 1, Module 1: Reading and Writing', time:480, qs:[
 { d:'Craft and Structure', s:'Words in Context',
   p:`<p>Marine biologist Ayana Okafor's study of reef fish was notable for its ______ approach: rather than relying on a single survey method, her team combined underwater video, acoustic tagging, and genetic sampling to track the same populations for five years.</p>`,
   q:`Which choice completes the text with the most logical and precise word or phrase?`,
   c:['redundant','narrow','improvised','multifaceted'], a:3,
   e:`"Multifaceted" means having many parts, which matches a team that combined three different methods. "Redundant" suggests unnecessary repetition, "improvised" suggests something unplanned (a five-year study clearly wasn't), and "narrow" contradicts the use of several methods.` },
 { d:'Craft and Structure', s:'Text Structure and Purpose',
   p:`<p>Many people assume that desert plants survive mainly by storing water. Some, like cacti, do. But the creosote bush takes a different approach: much of its root system spreads widely just below the surface, absorbing even light rainfall before it evaporates, and its small, resin-coated leaves lose very little moisture. The plant survives not by hoarding water but by capturing it quickly and spending it slowly.</p>`,
   q:`Which choice best describes the overall structure of the text?`,
   c:['It presents a common assumption, then describes an example that complicates it.',
      'It describes a scientific debate, then argues in favor of one side.',
      'It explains a biological process, then lists several of its drawbacks.',
      'It compares two plants, then concludes that they rely on the same strategy.'], a:0,
   e:`The text opens with a common belief (desert plants store water), concedes that some do, then uses "But" to introduce the creosote bush, which survives a different way. That complicates the assumption. There's no debate between scientists (B), no list of drawbacks (C), and the two plants use different strategies, not the same one (D).` },
 { d:'Craft and Structure', s:'Cross-Text Connections',
   p:`<p class="tlabel">Text 1</p><p>Some economists argue that a four-day workweek increases productivity because well-rested employees work more efficiently. In several recent pilot programs, companies reported that their total output held steady even as employees' hours fell.</p><p class="tlabel">Text 2</p><p>A labor researcher notes that most four-day-week pilot programs involved companies that volunteered to participate. Such firms were likely already confident the change would succeed, and their results may not reflect what would happen at businesses in general.</p>`,
   q:`Based on the texts, how would the labor researcher in Text 2 most likely respond to the pilot program results described in Text 1?`,
   c:['By agreeing that the results prove four-day weeks raise output in every industry',
      'By arguing that well-rested employees are actually less efficient than tired ones',
      'By cautioning that the results may not generalize, since participating companies chose to take part',
      'By claiming that the pilot programs measured output incorrectly'], a:2,
   e:`Text 2's whole point is a sampling problem: the companies volunteered, so they may have been unusually likely to succeed. That's a caution about generalizing. The researcher never disputes how output was measured (D) or claims rest lowers efficiency (B), and certainly doesn't say the results prove anything for every industry (A).` },
 { d:'Information and Ideas', s:'Central Ideas and Details',
   p:`<p>The following text is from an original short story. Mara has just returned to her grandmother's farm after ten years away.</p><p>The barn was smaller than she remembered, its red paint faded to the color of old brick. Yet when Mara pushed open the door, the smell of hay and engine oil met her exactly as it had when she was eight, and for a moment she was certain she would hear her grandmother calling her in for supper. She stood still, letting the years fold up like a map.</p>`,
   q:`Which choice best states the main idea of the text?`,
   c:['Mara is disappointed that the farm has not been well maintained.',
      'Although the barn looks different, its familiar smell powerfully returns Mara to her childhood.',
      'Mara regrets that she stayed away from the farm for so long.',
      'Mara is trying to remember how to repair an old engine in the barn.'], a:1,
   e:`The text sets up a contrast with "Yet": the barn looks smaller and faded, but the smell instantly brings back her eight-year-old self and her grandmother. "Letting the years fold up like a map" shows time collapsing into memory. The fading is a detail, not a complaint (A), regret is never stated (C), and engine oil is a smell, not a repair job (D).` },
 { d:'Information and Ideas', s:'Command of Evidence (Quantitative)',
   p:`<table><caption>Preferred Format Among Library Visitors, by Age Group (%)</caption><tr><th>Age group</th><th>Print</th><th>E-book</th><th>Audiobook</th></tr><tr><td>13–24</td><td>38</td><td>45</td><td>17</td></tr><tr><td>25–44</td><td>47</td><td>33</td><td>20</td></tr><tr><td>45–64</td><td>58</td><td>24</td><td>18</td></tr><tr><td>65+</td><td>71</td><td>15</td><td>14</td></tr></table><p>A student surveyed visitors to a city library about which book format they prefer. The student claims that, among the age groups surveyed, younger visitors were more likely than older visitors to prefer e-books.</p>`,
   q:`Which choice best describes data from the table that support the student's claim?`,
   c:['Visitors aged 65 and older preferred print more than any other format.',
      'Visitors aged 25–44 preferred print at a rate of 47%.',
      'Fewer than 21% of visitors in every age group preferred audiobooks.',
      'The percentage of visitors who preferred e-books fell from 45% for ages 13–24 to 15% for ages 65 and older.'], a:3,
   e:`The claim is specifically about e-books and age. Only D tracks the e-book column across age groups and shows it dropping as age rises. A and B are about print, and C is about audiobooks; all are true but irrelevant to the claim.` },
 { d:'Standard English Conventions', s:'Boundaries',
   p:`<p>The town's new community garden opened in ______ by June, volunteers had already harvested more than two hundred pounds of vegetables for the local food bank.</p>`,
   q:`Which choice completes the text so that it conforms to the conventions of Standard English?`,
   c:['April,','April;','April','April, which'], a:1,
   e:`Both sides are independent clauses ("The garden opened in April" / "by June, volunteers had already harvested..."). A semicolon correctly joins two independent clauses. A comma alone is a comma splice (A), no punctuation is a run-on (C), and "which" can't introduce a clause that starts "by June, volunteers..." (D).` },
 { d:'Expression of Ideas', s:'Transitions',
   p:`<p>Honeybees share the location of food through a "waggle dance," in which the angle of the dance tells other bees which direction to fly. ______ the length of the waggle portion signals distance: the longer the waggle, the farther away the food.</p>`,
   q:`Which choice completes the text with the most logical transition?`,
   c:['However,','For instance,','Additionally,','As a result,'], a:2,
   e:`The first sentence gives one thing the dance communicates (direction); the second adds another (distance). That's an addition, so "Additionally." Nothing contrasts (However), distance isn't an example of direction (For instance), and distance isn't caused by direction (As a result).` }
]},
{ sec:'rw', name:'Section 1, Module 2: Reading and Writing', time:480, qs:[
 { d:'Craft and Structure', s:'Words in Context',
   p:`<p>Although the committee's final report ran to more than two hundred pages, its recommendations were strikingly ______: each one could be stated in a single sentence and carried out within a year.</p>`,
   q:`Which choice completes the text with the most logical and precise word or phrase?`,
   c:['concise','ambiguous','controversial','tentative'], a:0,
   e:`"Although" sets up a contrast with the long report, and the colon explains that each recommendation fit in one sentence. That's "concise." "Ambiguous" (unclear) and "tentative" (uncertain) clash with recommendations that are short and actionable, and nothing suggests they were "controversial."` },
 { d:'Information and Ideas', s:'Inferences',
   p:`<p>Researchers studying one songbird species found that birds living near busy highways sang at higher pitches than birds of the same species living in quiet forests. Because traffic noise is concentrated at low frequencies, the researchers concluded that the shift in pitch likely helps the highway birds ______</p>`,
   q:`Which choice most logically completes the text?`,
   c:['avoid predators that hunt along roadsides.',
      'be heard by other birds over the low-frequency traffic noise.',
      'attract mates that prefer low-pitched songs.',
      'save energy during long migrations.'], a:1,
   e:`The key detail is that traffic noise is low-frequency. Singing higher moves the song out of that noisy range, so other birds can hear it. Predators (A) and migration (D) are never mentioned, and a preference for low pitches (C) would make singing higher counterproductive.` },
 { d:'Information and Ideas', s:'Command of Evidence (Textual)',
   p:`<p>A historian claims that the arrival of the railroad in the 1880s transformed daily life in the small town of Millbrook.</p>`,
   q:`Which finding, if true, would most directly support the historian's claim?`,
   c:['Millbrook\'s population stayed about the same between 1870 and 1890.',
      'Several towns near Millbrook did not receive railroad service until the early 1900s.',

/* ============================================================ STATE */
let S;
function fresh(){
  return { screen:'start', name:'', mi:0, qi:0, rem:0, hide:false, abc:false, nav:false, review:false, brk:150, warned:false,
    ans:MODS.map(m=>m.qs.map(()=>null)), mk:MODS.map(m=>m.qs.map(()=>false)),
    st:MODS.map(m=>m.qs.map(()=>[])), hl:MODS.map(m=>m.qs.map(()=>null)) };
}
S = fresh();
let tick = null, lastRange = null, calcObj = null, calcLoading = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => Math.floor(t/60) + ':' + String(Math.max(0,t)%60).padStart(2,'0');
const cur = () => MODS[S.mi].qs[S.qi];
const answered = (mi,qi) => { const a = S.ans[mi][qi]; return a !== null && a !== ''; };

function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ============================================================ FLOW */
function startModule(i){
  clearInterval(tick);
  S.mi=i; S.qi=0; S.rem=MODS[i].time; S.screen='test'; S.nav=false; S.review=false; S.warned=false;
  tick=setInterval(()=>{
    S.rem--; updTimer();
    if(S.rem===60 && !S.warned){ S.warned=true; toast('1 minute remaining in this module.'); }
    if(S.rem<=0) endModule();
  },1000);
  render();
}
function endModule(){
  clearInterval(tick); closeCalc();
  if(S.mi===1){
    S.screen='break'; S.brk=150;
    tick=setInterval(()=>{ S.brk--; const el=$('brk'); if(el) el.textContent=fmt(S.brk); if(S.brk<=0) startModule(2); },1000);
  } else if(S.mi===3){ S.screen='results'; }
  else { S.screen='between'; }
  render();
}
function updTimer(){
  const t=$('timer'); if(!t) return;
  t.textContent = S.hide ? '' : fmt(S.rem);
  t.classList.toggle('warn', S.rem<=60);
}

    h+='<div class="choices">'+q.c.map((c,i)=>{

/* ============================================================ SCORING */
function parseNum(v){
  if(v==null) return NaN; v=String(v).trim();
  if(/^-?\d+\/\d+$/.test(v)){ const neg=v.startsWith('-'); const [a,b]=v.replace('-','').split('/').map(Number); return b===0?NaN:(neg?-a/b:a/b); }
  if(/^-?(\d+\.?\d*|\.\d+)$/.test(v)) return Number(v);
  return NaN;
}
function isRight(q,a){
  if(a===null||a==='') return false;
  if(q.spr){ const n=parseNum(a); return q.spr.some(x=>Math.abs(x-n)<1e-6); }
  return a===q.a;
}
function previewHTML(a){
  if(!a) return '';
  if(/^-?\d+\/\d+$/.test(a)){ const neg=a.startsWith('-'); const [x,y]=a.replace('-','').split('/'); return (neg?'−':'')+fr(esc(x),esc(y)); }
  return esc(a).replace('-','−');
}
const r10 = x => Math.round(x/10)*10;

function resultsHTML(){
  const tally = idxs => { let c=0,t=0; idxs.forEach(mi=>MODS[mi].qs.forEach((q,qi)=>{t++; if(isRight(q,S.ans[mi][qi])) c++;})); return {c,t}; };
  const rw=tally([0,1]), ma=tally([2,3]);
  const rwS=r10(160+600*rw.c/rw.t), maS=r10(160+600*ma.c/ma.t), tot=rwS+maS;
  const si=Math.round((2*rwS+maS)/10);
  const doms={};
  MODS.forEach((m,mi)=>m.qs.forEach((q,qi)=>{ const k=q.d; doms[k]=doms[k]||{c:0,t:0,sec:m.sec}; doms[k].t++; if(isRight(q,S.ans[mi][qi])) doms[k].c++; }));
  const domRows=Object.entries(doms).map(([k,v])=>`<tr><td>${k}<div class="bar"><i style="width:${Math.round(100*v.c/v.t)}%"></i></div></td><td>${v.c} / ${v.t}</td></tr>`).join('');

  const reviewList = MODS.map((m,mi)=>`<h3 style="margin:22px 0 6px">${m.name}</h3>`+m.qs.map((q,qi)=>{
    const a=S.ans[mi][qi], ok=isRight(q,a);
    const yours = (a===null||a==='') ? 'Omitted' : (q.spr ? previewHTML(a) : L[a]);
    const corr = q.spr ? q.ans : L[q.a];
    const choices = q.spr ? '' : q.c.map((c,i)=>`<div class="rch ${i===q.a?'c':(i===a?'w':'')}">${L[i]}) ${c}</div>`).join('');
    return `<details class="rq ${ok?'ok':'bad'}"><summary><span class="badge">${ok?'✓':'✗'}</span><span class="rs">Q${qi+1} · ${q.s}</span><span class="ra">Yours: ${yours} · Correct: ${corr}</span></summary>
      <div class="rbody">${q.p?`<div class="passage" style="margin-top:12px">${q.p}</div>`:''}${q.fig?`<div class="fig">${q.fig}</div>`:''}<div class="prompt" style="margin:12px 0 8px">${q.q}</div>${choices}
      <div class="expl"><b>Explanation.</b> ${q.e}</div></div></details>`;
  }).join('')).join('');

  return `<div class="dash"></div><div class="page"><div class="inner">
   <h1>Your Results</h1>
   <div class="scorebig"><b>${tot}</b><span class="lead">estimated total · 320–1520 scale</span></div>
   <div class="scores">
    <div class="sc"><div class="l">Reading and Writing</div><div class="v">${rwS}</div><div class="s">${rw.c} of ${rw.t} correct · 160–760</div></div>
    <div class="sc"><div class="l">Math</div><div class="v">${maS}</div><div class="s">${ma.c} of ${ma.t} correct · 160–760</div></div>
   </div>
   <p class="note">This is a rough linear estimate, not College Board scoring. The real PSAT weights questions by difficulty and adapts Module 2 to your Module 1 performance, and with only 25 questions, one miss swings a section score by about 40–55 points. Treat it as a ballpark. Estimated NMSC Selection Index: <b>${si}</b> (2 × R&W + Math, ÷ 10).</p>
   <div class="box"><table class="dom"><tr><th>Domain</th><th style="text-align:right">Correct</th></tr>${domRows}</table></div>
   <h2 style="margin-bottom:0">Question review</h2><p class="lead" style="font-size:14px;margin-top:4px">Tap a question to see the passage, choices, and explanation.</p>
   ${reviewList}
   <div style="margin:28px 0;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="retake">Retake Test</button><button class="btn outline" data-act="print">Print / Save PDF</button></div>
  </div></div>`;
}

/* ============================================================ MODALS / CALC */
function modal(html){ const m=$('modal'); m.innerHTML=`<div class="mbox">${html}<button class="btn" data-act="close">Close</button></div>`; m.hidden=false; }
function directions(){
  if(MODS[S.mi].sec==='rw') modal(`<h2>Reading and Writing Directions</h2>
   <p>This section tests a range of reading and writing skills. Each question comes with one or more short passages, which may include a table.</p>
   <p>Read each passage and question carefully, then choose the best answer based on the passage(s). Every question is multiple choice with four options and one best answer.</p>`);
  else modal(`<h2>Math Directions</h2>
   <p>This section tests a range of math skills. You may use the calculator on every question, and the reference sheet is available from the toolbar.</p>
   <p>Unless a question says otherwise: all variables and expressions represent real numbers, figures are drawn to scale and lie in a plane, and the domain of a function <i>f</i> is all real <i>x</i> for which <i>f</i>(<i>x</i>) is a real number.</p>
   <p>For multiple-choice questions, pick the single best answer. For student-produced response questions, type your answer in the box; the rules are shown beside those questions.</p>`);
}
function reference(){
  modal(`<h2>Reference Sheet</h2><div class="refgrid">
   <div><b>Circle</b>A = πr²<br>C = 2πr</div>
   <div><b>Rectangle</b>A = ℓw</div>
   <div><b>Triangle</b>A = ½bh</div>
   <div><b>Pythagorean theorem</b>c² = a² + b²</div>
   <div><b>Special right triangles</b>30°-60°-90°: x, x√3, 2x<br>45°-45°-90°: s, s, s√2</div>
   <div><b>Rectangular prism</b>V = ℓwh</div>
   <div><b>Cylinder</b>V = πr²h</div>
   <div><b>Sphere</b>V = ⁴⁄₃πr³</div>
   <div><b>Cone</b>V = ⅓πr²h</div>
   <div><b>Pyramid</b>V = ⅓ℓwh</div>
  </div><p>A circle has 360 degrees of arc, or 2π radians. The angles of a triangle sum to 180°.</p>`);
}
function openCalc(){
  $('calc').hidden=false; document.body.classList.add('calc-open');
  if(!calcObj && !calcLoading){
    calcLoading=true;
    const s=document.createElement('script');
    s.src='https://www.desmos.com/api/v1.9/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6';
    s.onload=()=>{ $('calcBody').innerHTML=''; try{ calcObj=Desmos.GraphingCalculator($('calcBody'),{keypad:true}); }catch(e){ calcFail(); } };
    s.onerror=()=>{ calcLoading=false; calcFail(); };
    document.head.appendChild(s);
  }
}
function calcFail(){ $('calcBody').innerHTML=`<p style="padding:16px;font-size:14px;line-height:1.5">Couldn't load the Desmos calculator — it needs an internet connection. <a href="https://www.desmos.com/calculator" target="_blank" rel="noopener">Open Desmos in a new tab</a> instead.</p>`; }
function closeCalc(){ $('calc').hidden=true; document.body.classList.remove('calc-open','calc-wide'); $('calc').classList.remove('wide'); $('calcWideBtn').textContent='Expand'; }

/* ============================================================ HIGHLIGHTING */
document.addEventListener('selectionchange',()=>{
  const sel=getSelection(); const p=$('ptext');
  if(p && sel.rangeCount && !sel.isCollapsed){ const r=sel.getRangeAt(0); if(p.contains(r.commonAncestorContainer)) lastRange=r.cloneRange(); }
});
function doHighlight(){
  const p=$('ptext');
  if(!p || !lastRange || lastRange.collapsed || !p.contains(lastRange.commonAncestorContainer)){ toast('Select some passage text first, then tap Highlight.'); return; }
  const r=lastRange, nodes=[], w=document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  while(w.nextNode()){ const n=w.currentNode; if(r.intersectsNode(n) && n.textContent.trim()) nodes.push(n); }
  nodes.forEach(n=>{
    let s=0, e=n.length;
    if(n===r.startContainer) s=r.startOffset;
    if(n===r.endContainer) e=r.endOffset;
    if(e<=s) return;
    const mid=n.splitText(s); mid.splitText(e-s);
    const mk=document.createElement('mark'); mid.parentNode.insertBefore(mk,mid); mk.appendChild(mid);
  });
  lastRange=null; getSelection().removeAllRanges();
  S.hl[S.mi][S.qi]=p.innerHTML;
}

/* ============================================================ EVENTS */
function onSpr(e){
  let v=e.target.value.replace(/[^0-9.\/-]/g,'');
  v=v.replace(/(?!^)-/g,'');
  if(!v.startsWith('-') && v.length>5) v=v.slice(0,5);
  e.target.value=v; S.ans[S.mi][S.qi]=v; $('pv').innerHTML=previewHTML(v);
}

document.addEventListener('click',e=>{
  const mk=e.target.closest('#ptext mark');
  if(mk && !e.target.closest('[data-act]')){
    const p=$('ptext'); mk.replaceWith(...mk.childNodes); p.normalize(); S.hl[S.mi][S.qi]=p.innerHTML; return;
  }
  if(S.nav && !e.target.closest('.pop') && !e.target.closest('[data-act="nav"]')){ S.nav=false; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, i=+b.dataset.i;
  switch(act){
    case 'start': S.name=($('nm').value||'').trim(); startModule(0); break;
    case 'cont': startModule(S.mi+1); break;
    case 'resume': startModule(2); break;
    case 'retake': clearInterval(tick); closeCalc(); S=fresh(); render(); break;
    case 'print': document.querySelectorAll('details.rq').forEach(d=>d.open=true); window.print(); break;
    case 'dir': directions(); break;
    case 'ref': reference(); break;
    case 'close': $('modal').hidden=true; break;
    case 'calc': $('calc').hidden ? openCalc() : closeCalc(); render(); break;
    case 'calcwide': { const c=$('calc'); c.classList.toggle('wide'); document.body.classList.toggle('calc-wide'); b.textContent=c.classList.contains('wide')?'Shrink':'Expand'; if(calcObj) setTimeout(()=>calcObj.resize(),220); break; }
    case 'hide': S.hide=!S.hide; render(); break;
    case 'hl': doHighlight(); break;
    case 'mark': S.mk[S.mi][S.qi]=!S.mk[S.mi][S.qi]; render(); break;
    case 'abc': S.abc=!S.abc; render(); break;
    case 'pick': { const st=S.st[S.mi][S.qi]; const k=st.indexOf(i); if(k>-1) st.splice(k,1); S.ans[S.mi][S.qi]=i; render(); break; }
    case 'strike': { const st=S.st[S.mi][S.qi]; const k=st.indexOf(i); if(k>-1) st.splice(k,1); else { st.push(i); if(S.ans[S.mi][S.qi]===i) S.ans[S.mi][S.qi]=null; } render(); break; }
    case 'nav': S.nav=!S.nav; render(); break;
    case 'goto': S.qi=+b.dataset.q; S.review=false; S.nav=false; render(); break;
    case 'toreview': S.review=true; S.nav=false; render(); break;
    case 'back': if(S.review){ S.review=false; S.qi=MODS[S.mi].qs.length-1; } else if(S.qi>0) S.qi--; S.nav=false; render(); break;
    case 'next':
      if(S.review){ endModule(); }
      else if(S.qi<MODS[S.mi].qs.length-1){ S.qi++; S.nav=false; render(); }
      else { S.review=true; S.nav=false; render(); }
      break;
  }
});
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('modal').hidden=true; });
window.addEventListener('beforeunload',e=>{ if(S.screen==='test'||S.screen==='between'||S.screen==='break'){ e.preventDefault(); e.returnValue=''; } });

render();
</script>
</body>
